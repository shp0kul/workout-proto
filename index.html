<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>Спорт Дневник</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <h1>🏋️ Спорт Дневник</h1>
      <div class="day-badge" id="dayBadge">Понедельник</div>
    </header>
    <main class="main">
      <section class="workout-card" id="workoutCard">
        <div class="exercise-group" id="exerciseList"></div>
      </section>
      <div class="status-bar" id="statusBar">
        <span id="syncStatus">🟢 Локально</span>
        <button class="btn-sync" id="btnSync" onclick="syncAll()">☁️ Синхронизировать</button>
      </div>
    </main>
    <footer class="footer"><small>Прототип v0.1 • Данные в localStorage</small></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>

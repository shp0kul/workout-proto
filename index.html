<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>Спорт Дневник</title>
  <link rel="stylesheet" href="style.css?v=20260801d">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <h1>🏋️ Спорт Дневник</h1>
      <div class="users-bar" id="usersBar"></div>
      <div class="day-badge" id="dayBadge">Понедельник</div>
      <div class="tabs" id="tabsBar">
        <button class="tab active" data-tab="strength">💪 Силовая</button>
        <button class="tab" data-tab="max">🏆 Максимумы</button>
        <button class="tab" data-tab="wod">🔥 WOD</button>
        <button class="tab" data-tab="wodarch">📚 Архив</button>
      </div>
      <div class="selectors" id="selectors">
        <select id="weekSelect" class="selector"></select>
        <select id="exSelect" class="selector"></select>
      </div>
    </header>
    <main class="main">
      <section class="workout-card" id="workoutCard">
        <div class="exercise-group" id="exerciseList"></div>
      </section>
      <div class="status-bar" id="statusBar">
        <span id="syncStatus">🟡 Пусто</span>
      </div>
    </main>
    <footer class="footer"><small>Спорт Дневник v1.10</small></footer>
  </div>
  <script src="app.js?v=20260801d"></script>
</body>
</html>
